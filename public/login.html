<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Login</title>
</head>
<body>

  <div class="container-auth">
    <div class="form-container-auth">
      <div class="form-group-header">
        <h1 class="form-auth-title">Login</h1>
        <h2 class="form-auth-subtitle">Enter your credentials to access the DummyJSON CRUD tool</h2>
      </div>
      <div class="form-group">
        <div class="form-group-label">
          <label>Email: </label>
        </div>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <div class="form-group-label">
          <label>Password: </label>
        </div>
        <input id="password" placeholder="Enter your password">
        <a class="form-auth-link" href="register.html">Don't have an account? Click here!</a>
      </div>

      <div class="form-group">
        <button class="login-button" id="login-button">LOGIN</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="login.js"></script>
</body>
</html>
